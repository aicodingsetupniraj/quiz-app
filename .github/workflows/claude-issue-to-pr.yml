# @claude on an issue or a PR comment - branch, work, draft PR.
#
# Only responds to a user with write access, checked explicitly below. Without that
# check, anyone who can open an issue on this repository can run an agent inside it.
#
# The output is always a DRAFT PR. AI changes are never auto-merged, and never pushed
# to main - see .claude/rules/autonomy.md.

name: Claude issue to PR

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]

permissions:
  contents: write
  pull-requests: write
  id-token: write        # claude-code-action authenticates by OIDC
  issues: write

jobs:
  respond:
    if: >-
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'issues' && contains(github.event.issue.body, '@claude'))
      ) &&
      (
        github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR' ||
        github.event.issue.author_association == 'OWNER' ||
        github.event.issue.author_association == 'MEMBER' ||
        github.event.issue.author_association == 'COLLABORATOR'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: "--max-turns 40"
          prompt: |
            Act on the @claude request in this issue or comment.

            If the issue body carries a footer like `<!-- slice: 012 ... -->`, it came from
            docs/plan/. Use the execute-slice skill and follow it exactly - /fix-issue and
            /build-plan follow the same skill, and all three must produce identical work.
            Read only that slice and the requirements it cites, not the whole plan.

            Read CLAUDE.md and .claude/rules/ before writing anything. Follow the rules
            files matching the paths you touch.

            Non-negotiable:
              - Work on a NEW BRANCH. Never commit to main.
              - Open a DRAFT pull request. Never mark it ready, never merge it.
              - Check .claude/rules/autonomy.md for the risk tier first. If this touches
                auth, migrations, infra, .github/**, .claude/**, or anything handling money,
                it is the high tier: post a PLAN as a comment and stop. Do not implement it.
              - New behaviour ships with a test. A new entry point ships with the negative
                authorization test - see the authz-test skill.
              - Never add a dependency without stating the reason in the PR description.

            In the PR description, say what you did, what you tested and the actual result,
            and what you were unsure about. The uncertainty is the useful part - do not
            present an untested change as a finished one.

            If the request is ambiguous enough that two readings give materially different
            work, ask in a comment instead of guessing.
