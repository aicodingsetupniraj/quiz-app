# Dependency updates, as pull requests.
#
# This file is the whole of "enable Dependabot" - committing it is what turns version
# updates on. Nothing to click. Dependabot *alerts* are a repository setting and are
# enabled separately by /setup-repo through the API.
#
# github-actions is here for every repository, whatever it is written in: it is what stops
# a pinned action going stale for two years and being noticed only when it breaks. Add the
# ecosystem for your stack below - /setup-repo fills it in from the manifest it detected.

version: 2
updates:
  # Every repository has workflows. This one applies everywhere.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  # The stack's own dependencies. /setup-repo replaces the ecosystem with the one it
  # detected: npm, pip, uv, gomod, cargo, nuget, maven, gradle, bundler, composer.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Patch and minor arrive grouped, as one reviewable PR rather than nine. A major
    # crosses a compatibility boundary and gets its own PR, because it needs reading.
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "deps"
    # Majors the toolchain cannot take yet. Each one failed CI on its own PR.
    # Remove the entry when the blocker named next to it is gone.
    ignore:
      # eslint 10: eslint-plugin-react (via eslint-config-next 16.3) crashes on load -
      # "contextOrFilename.getFilename is not a function".
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # typescript 7: typescript-eslint (via eslint-config-next) refuses to load -
      # "typescript-eslint does not support TS 7.0".
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # @types/node tracks the runtime in .nvmrc (Node 24), not the newest Node.
      - dependency-name: "@types/node"
        versions: [">=25"]
